name: Build StockBench with Pyinstaller
on:
  push:
    branches:
      - release/*
jobs:
  Build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]


    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
  
      - name: Build
        run: |
              python -m pip install --upgrade pip  
              if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build
        run: |
          pyinstaller src/main.py --name StockBench --onefile --windowed --noconfirm --icon=src/resources/images/candle.ico --version-file=src/version_spec.YAML

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockBench (Needs Version)
          path: src/dist/release
          
      
